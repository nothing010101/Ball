<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realistic 3D Earth Simulator</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        #ui {
            position: absolute; top: 20px; left: 20px; color: white;
            pointer-events: none; text-shadow: 2px 2px 5px #000;
        }
        #stats { font-size: 0.9em; margin-top: 10px; color: #aaa; }
        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; font-size: 1.5em; text-align: center; display: none;
        }
    </style>
</head>
<body>

<div id="ui">
    <h1 style="margin:0; font-size: 1.5em;">Bumi & Meteor 3D</h1>
    <p style="margin:5px 0 0 0; font-size:0.8em; opacity: 0.8;">Klik untuk meluncurkan Meteor!</p>
    <div id="stats">Meteor Aktif: 0</div>
</div>

<div id="loading">Memuat Tekstur Bumi...</div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // --- SETUP SCENE & CAMERA ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // --- TEXTURE LOADER & LOADING UI ---
    const loadingUI = document.getElementById('loading');
    loadingUI.style.display = 'block';

    const textureLoader = new THREE.TextureLoader();
    textureLoader.crossOrigin = 'Anonymous'; // Penting untuk menarik gambar dari domain berbeda

    // Gunakan URL Texture yang stabil (Contoh dari server publik yang terpercaya)
    const earthMapUrl = 'https://unpkg.com/three-globe@2.31.0/example/img/earth-blue-marble.jpg';
    const earthBumpUrl = 'https://unpkg.com/three-globe@2.31.0/example/img/earth-topology.png';
    const cloudMapUrl = 'https://unpkg.com/three-globe@2.31.0/example/img/earth-clouds.png';

    // Muat semua tekstur sekaligus
    Promise.all([
        textureLoader.loadAsync(earthMapUrl),
        textureLoader.loadAsync(earthBumpUrl),
        textureLoader.loadAsync(cloudMapUrl)
    ]).then(([earthMap, earthBump, cloudMap]) => {
        loadingUI.style.display = 'none'; // Sembunyikan loading jika selesai
        createScene(earthMap, earthBump, cloudMap);
    }).catch(err => {
        loadingUI.innerText = "Gagal memuat tekstur. Cek Koneksi!";
        console.error("Detail Error:", err);
    });

    function createScene(earthMap, earthBump, cloudMap) {
        // --- 1. MATAHARI (SUMBER CAHAYA KUAT) ---
        const sunLight = new THREE.DirectionalLight(0xffffff, 2);
        sunLight.position.set(15, 5, 20); // Posisi cahaya dari samping depan
        scene.add(sunLight);
        scene.add(new THREE.AmbientLight(0x151515)); // Sedikit cahaya dasar di sisi gelap

        // --- 2. BUMI REALISTIK ---
        const earthGeometry = new THREE.SphereGeometry(2, 64, 64); // Geometry halus
        
        // MeshPhongMaterial mendukung Bump Map (Tekstur pegunungan/topografi)
        const earthMaterial = new THREE.MeshPhongMaterial({ 
            map: earthMap,
            bumpMap: earthBump,
            bumpScale: 0.15, // Seberapa menonjol pegunungan
            specular: new THREE.Color('#333'), // Efek kilau air
            shininess: 5,
        });
        const earth = new THREE.Mesh(earthGeometry, earthMaterial);
        scene.add(earth);

        // --- 3. LAPISAN AWAN ---
        // Sedikit lebih besar dari bumi (2.02 vs 2.0) agar terlihat melayang
        const cloudGeometry = new THREE.SphereGeometry(2.02, 64, 64);
        const cloudMaterial = new THREE.MeshPhongMaterial({
            map: cloudMap,
            transparent: true, // Biar laut/daratan bumi terlihat di celah awan
            opacity: 0.8,
            depthWrite: false, // Penting agar tidak tumpang tindih aneh dengan Meteor
        });
        const clouds = new THREE.Mesh(cloudGeometry, cloudMaterial);
        scene.add(clouds);

        // --- 4. BINTANG-BINTANG (BACKGROUND) ---
        const starGeometry = new THREE.BufferGeometry();
        const starMaterial = new THREE.PointsMaterial({ color: 0xffffff });
        const starVertices = [];
        for (let i = 0; i < 7000; i++) {
            starVertices.push((Math.random() - 0.5) * 1000, (Math.random() - 0.5) * 1000, (Math.random() - 0.5) * 1000);
        }
        starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starVertices, 3));
        const stars = new THREE.Points(starGeometry, starMaterial);
        scene.add(stars);

        // --- 5. LOGIK METEOR ---
        const meteors = [];
        const statsElement = document.getElementById('stats');

        function launchMeteor() {
            // Buat meteor kecil
            const geometry = new THREE.DodecahedronGeometry(0.2, 1); // Bentuk tidak beraturan
            const material = new THREE.MeshBasicMaterial({ color: 0xff4400, wireframe: false });
            const meteor = new THREE.Mesh(geometry, material);

            // Posisi awal acak di kejauhan
            const angle = Math.random() * Math.PI * 2;
            meteor.position.set(Math.cos(angle) * 15, Math.sin(angle) * 15, (Math.random() - 0.5) * 10);
            
            // Vektor kecepatan menuju pusat (Bumi)
            const direction = new THREE.Vector3().subVectors(earth.position, meteor.position).normalize();
            meteor.userData.velocity = direction.multiplyScalar(0.1 + Math.random() * 0.1);

            scene.add(meteor);
            meteors.push(meteor);
            statsElement.innerText = `Meteor Aktif: ${meteors.length}`;
        }

        window.addEventListener('mousedown', launchMeteor);

        // --- 6. ANIMATION LOOP ---
        camera.position.z = 10;
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enablePan = false; // Batasi pergerakan geser kamera

        function animate() {
            requestAnimationFrame(animate);

            // Rotasi Bumi & Awan (Awan bergerak sedikit lebih cepat)
            earth.rotation.y += 0.001;
            clouds.rotation.y += 0.0015;

            // Update posisi meteor
            for (let i = meteors.length - 1; i >= 0; i--) {
                const m = meteors[i];
                m.position.add(m.userData.velocity);
                m.rotation.x += 0.05; // Putar meteor

                // Cek tabrakan (jarak ke permukaan bumi)
                if (m.position.distanceTo(earth.position) < 2.05) {
                    scene.remove(m);
                    meteors.splice(i, 1);
                    statsElement.innerText = `Meteor Aktif: ${meteors.length}`;
                }
            }

            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    }

    // --- REFRESH BILA RESIZE WINDOW ---
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>

</body>
</html>
