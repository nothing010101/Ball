<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bumi 3D Simulator</title>
    <style>
        body { margin: 0; background: radial-gradient(circle, #111, #000); overflow: hidden; font-family: sans-serif; }
        #ui { position: absolute; top: 20px; left: 20px; color: white; pointer-events: none; z-index: 10; }
        #stats { font-size: 0.8em; color: #00ffcc; margin-top: 5px; }
        canvas { display: block; }
    </style>
</head>
<body>

<div id="ui">
    <h1 style="margin:0; font-size: 1.2em;">Earth Meteor Simulation</h1>
    <div id="stats">Ketuk layar untuk luncurkan meteor!</div>
</div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // Pencahayaan
    const sunLight = new THREE.DirectionalLight(0xffffff, 2.5);
    sunLight.position.set(5, 3, 5);
    scene.add(sunLight);
    scene.add(new THREE.AmbientLight(0x333333));

    // Loading Tekstur dengan Fallback
    const textureLoader = new THREE.TextureLoader();
    textureLoader.setCrossOrigin('anonymous');

    // Link tekstur cadangan yang lebih stabil
    const earthTexture = textureLoader.load(
        'https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_atmos_2048.jpg',
        function(texture) {
            console.log("Tekstur berhasil dimuat");
        },
        undefined,
        function(err) {
            console.error("Gagal muat tekstur, menggunakan mode warna.");
            earthMaterial.color.setHex(0x2244ff); // Jika gagal, jadi biru laut
        }
    );

    // Objek Bumi
    const earthGeometry = new THREE.SphereGeometry(2, 64, 64);
    const earthMaterial = new THREE.MeshPhongMaterial({ 
        map: earthTexture,
        shininess: 15
    });
    const earth = new THREE.Mesh(earthGeometry, earthMaterial);
    scene.add(earth);

    // Bintang Background
    const starsGeo = new THREE.BufferGeometry();
    const starsMat = new THREE.PointsMaterial({ color: 0x888888, size: 0.7 });
    const starCoords = [];
    for(let i=0; i<10000; i++) {
        starCoords.push((Math.random()-0.5)*1000, (Math.random()-0.5)*1000, (Math.random()-0.5)*1000);
    }
    starsGeo.setAttribute('position', new THREE.Float32BufferAttribute(starCoords, 3));
    scene.add(new THREE.Points(starsGeo, starsMat));

    // Kontrol & Meteor
    const controls = new OrbitControls(camera, renderer.domElement);
    camera.position.z = 8;
    const meteors = [];

    function spawnMeteor() {
        const geo = new THREE.IcosahedronGeometry(0.15, 0);
        const mat = new THREE.MeshBasicMaterial({ color: 0xff6600 });
        const m = new THREE.Mesh(geo, mat);
        
        const angle = Math.random() * Math.PI * 2;
        m.position.set(Math.cos(angle)*12, Math.sin(angle)*12, (Math.random()-0.5)*5);
        m.userData.dir = new THREE.Vector3(0,0,0).subVectors(earth.position, m.position).normalize();
        
        scene.add(m);
        meteors.push(m);
    }

    window.addEventListener('pointerdown', spawnMeteor);

    function animate() {
        requestAnimationFrame(animate);
        earth.rotation.y += 0.002;
        
        meteors.forEach((m, idx) => {
            m.position.addScaledVector(m.userData.dir, 0.15);
            if(m.position.distanceTo(earth.position) < 2) {
                scene.remove(m);
                meteors.splice(idx, 1);
                // Efek kilatan singkat
                earthMaterial.emissive.setHex(0x330000);
                setTimeout(() => earthMaterial.emissive.setHex(0x000000), 100);
            }
        });

        controls.update();
        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
