<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clanker.world Whipping Simulator</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <div class="terminal-window">
            <div class="terminal-header">
                <span class="control red"></span>
                <span class="control yellow"></span>
                <span class="control green"></span>
                <span class="title">Read and execute Task.txt file</span>
            </div>
            <div id="terminal-container"></div>
        </div>

        <div class="controls">
            <button id="whip-button" class="whip-btn">💥 PECUUT! (FASTER)</button>
            <p class="instruction">Ketuk tombol di atas untuk "mencambuk" bot agar bekerja lebih cepat.</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
