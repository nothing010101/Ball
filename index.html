<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Flappy Rocket - Space Edition</title>
    <style>
        body { margin: 0; background: #050505; color: white; font-family: sans-serif; overflow: hidden; touch-action: manipulation; }
        canvas { display: block; margin: 0 auto; background: linear-gradient(#000, #111); }
        #ui { position: absolute; top: 20px; width: 100%; text-align: center; pointer-events: none; }
        #score { font-size: 48px; font-weight: bold; text-shadow: 0 0 10px #00ffcc; }
        .msg { font-size: 18px; color: #aaa; }
    </style>
</head>
<body>

<div id="ui">
    <div id="score">0</div>
    <div class="msg" id="msg">Tap untuk Terbang</div>
</div>

<canvas id="game"></canvas>

<script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const msgEl = document.getElementById('msg');

    canvas.width = window.innerWidth > 500 ? 400 : window.innerWidth;
    canvas.height = window.innerHeight;

    // Game Constants
    const gravity = 0.25;
    const flap = -5;
    const pipeWidth = 60;
    const pipeGap = 160;
    const pipeSpeed = 2.5;

    let bird = { x: 50, y: canvas.height/2, v: 0, radius: 15 };
    let pipes = [];
    let score = 0;
    let gameActive = false;
    let frame = 0;

    function reset() {
        bird.y = canvas.height/2;
        bird.v = 0;
        pipes = [];
        score = 0;
        frame = 0;
        scoreEl.innerText = score;
        msgEl.style.opacity = 1;
        gameActive = false;
        draw();
    }

    function createPipe() {
        let minPipeHeight = 50;
        let maxPipeHeight = canvas.height - pipeGap - minPipeHeight;
        let height = Math.floor(Math.random() * (maxPipeHeight - minPipeHeight + 1) + minPipeHeight);
        
        pipes.push({
            x: canvas.width,
            top: height,
            passed: false
        });
    }

    function update() {
        if (!gameActive) return;

        frame++;
        bird.v += gravity;
        bird.y += bird.v;

        // Spawn pipes
        if (frame % 90 === 0) createPipe();

        // Update pipes
        for (let i = pipes.length - 1; i >= 0; i--) {
            pipes[i].x -= pipeSpeed;

            // Collision check
            if (
                bird.x + bird.radius > pipes[i].x && 
                bird.x - bird.radius < pipes[i].x + pipeWidth &&
                (bird.y - bird.radius < pipes[i].top || bird.y + bird.radius > pipes[i].top + pipeGap)
            ) {
                gameOver();
            }

            // Score check
            if (!pipes[i].passed && pipes[i].x + pipeWidth < bird.x) {
                score++;
                scoreEl.innerText = score;
                pipes[i].passed = true;
            }

            // Remove off-screen pipes
            if (pipes[i].x + pipeWidth < 0) pipes.splice(i, 1);
        }

        // Boundary check
        if (bird.y + bird.radius > canvas.height || bird.y - bird.radius < 0) {
            gameOver();
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw Stars (Simple)
        ctx.fillStyle = "white";
        for(let i=0; i<20; i++) {
            ctx.fillRect((i*77)%canvas.width, (frame + i*99)%canvas.height, 2, 2);
        }

        // Draw Pipes (Nebula/Space Pipes)
        pipes.forEach(p => {
            ctx.fillStyle = "#222";
            ctx.strokeStyle = "#00ffcc";
            ctx.lineWidth = 2;
            
            // Top Pipe
            ctx.fillRect(p.x, 0, pipeWidth, p.top);
            ctx.strokeRect(p.x, 0, pipeWidth, p.top);
            
            // Bottom Pipe
            ctx.fillRect(p.x, p.top + pipeGap, pipeWidth, canvas.height);
            ctx.strokeRect(p.x, p.top + pipeGap, pipeWidth, canvas.height);
        });

        // Draw Rocket (Bird)
        ctx.save();
        ctx.translate(bird.x, bird.y);
        ctx.rotate(Math.min(Math.PI/4, Math.max(-Math.PI/4, bird.v * 0.1)));
        
        // Body
        ctx.fillStyle = "#ff3366";
        ctx.beginPath();
        ctx.arc(0, 0, bird.radius, 0, Math.PI * 2);
        ctx.fill();
        
        // Window
        ctx.fillStyle = "white";
        ctx.beginPath();
        ctx.arc(8, 0, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    function gameOver() {
        gameActive = false;
        msgEl.innerText = "Game Over! Tap untuk Reset";
        msgEl.style.opacity = 1;
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    window.addEventListener('mousedown', () => {
        if (!gameActive) {
            if (msgEl.innerText.includes("Over")) {
                reset();
            }
            gameActive = true;
            msgEl.style.opacity = 0;
        }
        bird.v = flap;
    });

    window.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (!gameActive) {
            if (msgEl.innerText.includes("Over")) {
                reset();
            }
            gameActive = true;
            msgEl.style.opacity = 0;
        }
        bird.v = flap;
    }, {passive: false});

    reset();
    loop();
</script>
</body>
</html>
