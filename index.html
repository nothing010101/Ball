<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Space Simulator - Rocket & Meteor</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; font-family: sans-serif; }
        #ui {
            position: absolute; top: 20px; left: 20px; color: white;
            pointer-events: none; text-shadow: 2px 2px 4px #000;
        }
        .instruction { font-size: 0.9em; opacity: 0.8; }
        canvas { display: block; }
    </style>
</head>
<body>

<div id="ui">
    <h1>Space Simulator 3D</h1>
    <p class="instruction">Klik di mana saja untuk meluncurkan Meteor ke arah Bumi!</p>
    <div id="stats">Meteor Aktif: 0</div>
</div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // 1. SETUP SCENE
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // 2. LIGHTING
    const sunLight = new THREE.PointLight(0xffffff, 2, 100);
    sunLight.position.set(10, 10, 10);
    scene.add(sunLight);
    scene.add(new THREE.AmbientLight(0x404040)); // Cahaya redup agar sisi gelap planet terlihat

    // 3. PLANET (Bumi Sederhana)
    const earthGeometry = new THREE.SphereGeometry(2, 32, 32);
    const earthMaterial = new THREE.MeshPhongMaterial({ 
        color: 0x2233ff, 
        wireframe: false,
        emissive: 0x112244
    });
    const earth = new THREE.Mesh(earthGeometry, earthMaterial);
    scene.add(earth);

    // Bintang-bintang di background
    const starGeometry = new THREE.BufferGeometry();
    const starMaterial = new THREE.PointsMaterial({ color: 0xffffff });
    const starVertices = [];
    for (let i = 0; i < 5000; i++) {
        starVertices.push((Math.random() - 0.5) * 1000, (Math.random() - 0.5) * 1000, (Math.random() - 0.5) * 1000);
    }
    starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starVertices, 3));
    const stars = new THREE.Points(starGeometry, starMaterial);
    scene.add(stars);

    camera.position.z = 10;
    const controls = new OrbitControls(camera, renderer.domElement);

    // 4. LOGIK METEOR
    const meteors = [];
    const statsElement = document.getElementById('stats');

    function launchMeteor() {
        // Buat meteor kecil
        const geometry = new THREE.SphereGeometry(0.2, 8, 8);
        const material = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
        const meteor = new THREE.Mesh(geometry, material);

        // Posisi awal acak di kejauhan
        const angle = Math.random() * Math.PI * 2;
        meteor.position.set(Math.cos(angle) * 15, Math.sin(angle) * 15, (Math.random() - 0.5) * 10);
        
        // Vektor kecepatan menuju pusat (Bumi)
        const direction = new THREE.Vector3().subVectors(earth.position, meteor.position).normalize();
        meteor.userData.velocity = direction.multiplyScalar(0.1 + Math.random() * 0.2);

        scene.add(meteor);
        meteors.push(meteor);
        statsElement.innerText = `Meteor Aktif: ${meteors.length}`;
    }

    // Event listener untuk klik
    window.addEventListener('mousedown', launchMeteor);

    // 5. ANIMATION LOOP
    function animate() {
        requestAnimationFrame(animate);

        // Rotasi bumi
        earth.rotation.y += 0.005;

        // Update posisi meteor
        for (let i = meteors.length - 1; i >= 0; i--) {
            const m = meteors[i];
            m.position.add(m.userData.velocity);

            // Cek tabrakan (jarak ke pusat bumi < radius bumi)
            if (m.position.distanceTo(earth.position) < 2) {
                scene.remove(m);
                meteors.splice(i, 1);
                
                // Efek visual sederhana saat tabrakan (Bumi "berkedip")
                earth.material.emissive.setHex(0xff0000);
                setTimeout(() => earth.material.emissive.setHex(0x112244), 100);
                
                statsElement.innerText = `Meteor Aktif: ${meteors.length}`;
            }
        }

        controls.update();
        renderer.render(scene, camera);
    }

    animate();

    // Responsif jika window di-resize
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>

</body>
</html>
