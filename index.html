<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WHIP TERMINAL</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; cursor: none !important; }

  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap');

  :root {
    --green: #00ff41;
    --dark-green: #003b00;
    --bg: #0a0a0a;
    --amber: #ffb000;
    --red: #ff2222;
    --whip-color: #c8a46e;
  }

  body {
    background: var(--bg);
    color: var(--green);
    font-family: 'Share Tech Mono', monospace;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    position: relative;
  }

  /* Scanlines */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.15) 2px,
      rgba(0,0,0,0.15) 4px
    );
    pointer-events: none;
    z-index: 999;
  }

  /* CRT vignette */
  body::after {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.8) 100%);
    pointer-events: none;
    z-index: 998;
  }

  #terminal {
    position: absolute;
    inset: 20px;
    border: 1px solid var(--green);
    border-radius: 4px;
    box-shadow: 0 0 20px rgba(0,255,65,0.3), inset 0 0 30px rgba(0,0,0,0.5);
    overflow: hidden;
    background: rgba(0,10,0,0.95);
  }

  #terminal-header {
    background: var(--dark-green);
    padding: 6px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid var(--green);
    font-family: 'VT323', monospace;
    font-size: 18px;
    letter-spacing: 2px;
    text-shadow: 0 0 8px var(--green);
  }

  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot.r { background: #ff5f57; }
  .dot.y { background: #ffbd2e; }
  .dot.g { background: #28ca41; }

  #output-area {
    padding: 12px;
    height: calc(100% - 80px);
    overflow-y: auto;
    font-size: 13px;
    line-height: 1.6;
    scrollbar-width: thin;
    scrollbar-color: var(--green) transparent;
  }

  #output-area::-webkit-scrollbar { width: 6px; }
  #output-area::-webkit-scrollbar-thumb { background: var(--green); }

  .line { margin: 1px 0; white-space: pre-wrap; word-break: break-all; }
  .line.prompt { color: var(--green); text-shadow: 0 0 6px var(--green); }
  .line.output { color: #8bff8b; }
  .line.error { color: var(--red); text-shadow: 0 0 6px var(--red); }
  .line.info { color: var(--amber); text-shadow: 0 0 6px var(--amber); }
  .line.system { color: #00aaff; text-shadow: 0 0 6px #00aaff; }
  .line.whip { color: #ffdd88; font-family: 'VT323', monospace; font-size: 16px; letter-spacing: 1px; }

  #input-row {
    position: absolute;
    bottom: 0;
    left: 0; right: 0;
    padding: 8px 12px;
    display: flex;
    align-items: center;
    border-top: 1px solid rgba(0,255,65,0.3);
    background: rgba(0,5,0,0.9);
    gap: 8px;
  }

  #prompt-label {
    color: var(--green);
    text-shadow: 0 0 8px var(--green);
    white-space: nowrap;
    font-size: 13px;
  }

  #cmd-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--green);
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    text-shadow: 0 0 6px var(--green);
    caret-color: var(--green);
  }

  /* Speed indicator */
  #speed-hud {
    position: fixed;
    top: 30px;
    right: 40px;
    font-family: 'VT323', monospace;
    font-size: 22px;
    color: var(--amber);
    text-shadow: 0 0 10px var(--amber);
    z-index: 100;
    pointer-events: none;
    text-align: right;
    line-height: 1.3;
  }

  #whip-count-display {
    color: var(--red);
    text-shadow: 0 0 12px var(--red);
    font-size: 28px;
  }

  /* WHIP CURSOR CANVAS */
  #whip-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 9999;
  }

  /* Flash on crack */
  #crack-flash {
    position: fixed;
    inset: 0;
    background: rgba(255,255,200,0);
    pointer-events: none;
    z-index: 9997;
    transition: background 0.05s;
  }

  /* Crack text */
  #crack-text {
    position: fixed;
    pointer-events: none;
    z-index: 9998;
    font-family: 'VT323', monospace;
    font-size: 32px;
    color: #fff;
    text-shadow: 0 0 20px #ff0, 0 0 40px #f80;
    opacity: 0;
    transform: scale(1);
    transition: opacity 0.3s, transform 0.3s;
  }

  #crack-text.show {
    opacity: 1;
    transform: scale(1.3);
  }

  /* Spark particles */
  .spark {
    position: fixed;
    pointer-events: none;
    z-index: 9996;
    border-radius: 50%;
    animation: spark-fly 0.4s ease-out forwards;
  }

  @keyframes spark-fly {
    0% { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
  }

  /* Screen shake */
  @keyframes shake {
    0%,100% { transform: translate(0,0); }
    20% { transform: translate(-3px, 2px); }
    40% { transform: translate(3px,-2px); }
    60% { transform: translate(-2px,3px); }
    80% { transform: translate(2px,-1px); }
  }

  .shaking {
    animation: shake 0.15s ease-in-out;
  }
</style>
</head>
<body>

<div id="crack-flash"></div>
<div id="crack-text" id="crack-text">CRACK!</div>
<canvas id="whip-canvas"></canvas>

<div id="speed-hud">
  <div>SPEED: <span id="speed-val">1.0</span>x</div>
  <div>WHIPS: <span id="whip-count-display">0</span></div>
</div>

<div id="terminal">
  <div id="terminal-header">
    <div class="dot r"></div>
    <div class="dot y"></div>
    <div class="dot g"></div>
    &nbsp; WHIP-TERMINAL v2.6 — CRACK TO ACCELERATE
  </div>
  <div id="output-area"></div>
  <div id="input-row">
    <span id="prompt-label">root@whip:~$</span>
    <input id="cmd-input" type="text" autocomplete="off" spellcheck="false" autofocus />
  </div>
</div>

<script>
// ─── STATE ───────────────────────────────────────────────────────────────────
let mouseX = window.innerWidth/2, mouseY = window.innerHeight/2;
let prevX = mouseX, prevY = mouseY;
let whipCount = 0;
let speedMultiplier = 1.0;
let lastCrackTime = 0;
let isTypingFast = false;

// Whip segments (rope physics)
const NUM_SEGMENTS = 18;
const SEGMENT_LENGTH = 14;
let segments = [];

// Init segments at cursor
function initSegments(x, y) {
  segments = [];
  for(let i = 0; i < NUM_SEGMENTS; i++) {
    segments.push({ x: x - i * 2, y: y + i * 1.5, vx: 0, vy: 0 });
  }
}
initSegments(mouseX, mouseY);

// ─── CANVAS ──────────────────────────────────────────────────────────────────
const canvas = document.getElementById('whip-canvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// ─── MOUSE TRACKING ──────────────────────────────────────────────────────────
let velX = 0, velY = 0;
let lastMoveTime = Date.now();

window.addEventListener('mousemove', (e) => {
  prevX = mouseX; prevY = mouseY;
  mouseX = e.clientX; mouseY = e.clientY;
  velX = mouseX - prevX;
  velY = mouseY - prevY;
  lastMoveTime = Date.now();
});

// ─── ROPE PHYSICS ────────────────────────────────────────────────────────────
function updateRope() {
  // Head follows mouse with some lag based on speed
  const lag = Math.max(0.25, 0.6 - speedMultiplier * 0.04);
  segments[0].x += (mouseX - segments[0].x) * (1 - lag);
  segments[0].y += (mouseY - segments[0].y) * (1 - lag);

  // Propagate with verlet-like constraint
  for(let i = 1; i < NUM_SEGMENTS; i++) {
    const prev = segments[i-1];
    const cur = segments[i];

    // Gravity + air resistance
    cur.vy += 0.35;
    cur.vx *= 0.88;
    cur.vy *= 0.88;

    cur.x += cur.vx;
    cur.y += cur.vy;

    // Distance constraint
    const dx = cur.x - prev.x;
    const dy = cur.y - prev.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    const segLen = SEGMENT_LENGTH * (1 - i * 0.02); // taper
    if(dist > segLen) {
      const ratio = (dist - segLen) / dist;
      cur.x -= dx * ratio * 0.5;
      cur.y -= dy * ratio * 0.5;
      prev.x += dx * ratio * 0.5;
      prev.y += dy * ratio * 0.5;
    }
  }
}

// ─── DRAW WHIP ───────────────────────────────────────────────────────────────
let crackGlow = 0;

function drawWhip() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if(segments.length < 2) return;

  // Handle/grip (thick end at tip)
  const handleLen = 3;

  for(let pass = 0; pass < 2; pass++) {
    ctx.beginPath();
    ctx.moveTo(segments[0].x, segments[0].y);

    for(let i = 1; i < NUM_SEGMENTS; i++) {
      const t = i / NUM_SEGMENTS;
      const cp = segments[i];
      ctx.lineTo(cp.x, cp.y);
    }

    const thickness = pass === 0 ? 1 : 0;

    // Gradient color along whip
    const grad = ctx.createLinearGradient(
      segments[0].x, segments[0].y,
      segments[NUM_SEGMENTS-1].x, segments[NUM_SEGMENTS-1].y
    );

    if(crackGlow > 0) {
      grad.addColorStop(0, `rgba(255, 220, 120, ${0.9 + crackGlow * 0.1})`);
      grad.addColorStop(0.3, `rgba(255, 180, 60, ${0.8})`);
      grad.addColorStop(0.7, `rgba(220, 120, 30, ${0.6})`);
      grad.addColorStop(1, `rgba(255, 255, 150, ${crackGlow})`);
    } else {
      grad.addColorStop(0, 'rgba(210, 170, 100, 0.95)');
      grad.addColorStop(0.4, 'rgba(160, 110, 55, 0.85)');
      grad.addColorStop(0.75, 'rgba(100, 65, 20, 0.7)');
      grad.addColorStop(1, 'rgba(80, 50, 10, 0.4)');
    }

    ctx.strokeStyle = pass === 0 ? grad : 'rgba(255,255,200,0.15)';
    ctx.lineWidth = pass === 0
      ? Math.max(0.5, 5 - (0 / NUM_SEGMENTS) * 4.5)
      : 2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    if(pass === 1 && crackGlow > 0) {
      ctx.shadowColor = '#ffdd88';
      ctx.shadowBlur = 15 * crackGlow;
    } else {
      ctx.shadowBlur = 0;
    }

    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  // Tapered segments with varying width
  for(let i = 0; i < NUM_SEGMENTS - 1; i++) {
    const t = i / NUM_SEGMENTS;
    const width = Math.max(0.5, 5.5 * (1 - t) * (1 - t));
    const a = segments[i], b = segments[i+1];

    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);

    let alpha = 0.85 - t * 0.4;
    let r = Math.floor(210 - t * 130);
    let g = Math.floor(170 - t * 120);
    let bl = Math.floor(100 - t * 90);

    if(crackGlow > 0 && t > 0.8) {
      r = 255; g = 255; bl = 150;
      alpha = crackGlow;
    }

    ctx.strokeStyle = `rgba(${r},${g},${bl},${alpha})`;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.stroke();
  }

  // Handle grip wrapping detail
  ctx.save();
  ctx.translate(segments[0].x, segments[0].y);
  const angle = Math.atan2(segments[1].y - segments[0].y, segments[1].x - segments[0].x);
  ctx.rotate(angle + Math.PI/2);
  for(let w = 0; w < 3; w++) {
    ctx.beginPath();
    ctx.rect(-3.5, w * 5 - 4, 7, 3);
    ctx.fillStyle = `rgba(80,50,20,${0.7 - w*0.1})`;
    ctx.fill();
    ctx.strokeStyle = 'rgba(200,160,80,0.5)';
    ctx.lineWidth = 0.5;
    ctx.stroke();
  }
  // Knob
  ctx.beginPath();
  ctx.arc(0, -6, 4, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(160,120,50,0.9)';
  ctx.fill();
  ctx.restore();

  // Tip sparkle when cracking
  if(crackGlow > 0.3) {
    const tip = segments[NUM_SEGMENTS - 1];
    ctx.beginPath();
    ctx.arc(tip.x, tip.y, 3 * crackGlow, 0, Math.PI*2);
    ctx.fillStyle = `rgba(255, 255, 150, ${crackGlow})`;
    ctx.shadowColor = '#ffff00';
    ctx.shadowBlur = 20 * crackGlow;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  crackGlow = Math.max(0, crackGlow - 0.05);
}

// ─── CRACK DETECTION ─────────────────────────────────────────────────────────
function detectCrack() {
  const speed = Math.sqrt(velX*velX + velY*velY);
  const now = Date.now();

  if(speed > 30 && now - lastCrackTime > 200) {
    lastCrackTime = now;
    triggerCrack(mouseX, mouseY, speed);
  }
}

const crackWords = ['CRACK!', 'SNAP!', 'WHAP!', 'THWACK!', 'FWISH!', 'CRACK!!', 'FASTER!!!'];

function triggerCrack(x, y, speed) {
  whipCount++;
  speedMultiplier = Math.min(10, 1 + whipCount * 0.25 + speed * 0.005);

  document.getElementById('whip-count-display').textContent = whipCount;
  document.getElementById('speed-val').textContent = speedMultiplier.toFixed(1);

  // Glow
  crackGlow = Math.min(1.5, speed / 40);

  // Screen flash
  const flash = document.getElementById('crack-flash');
  flash.style.background = `rgba(255,240,180,${Math.min(0.4, speed/120)})`;
  setTimeout(() => flash.style.background = 'rgba(255,255,200,0)', 80);

  // Screen shake
  document.body.classList.remove('shaking');
  void document.body.offsetWidth;
  document.body.classList.add('shaking');

  // Crack text
  const ct = document.getElementById('crack-text');
  ct.textContent = crackWords[Math.floor(Math.random() * crackWords.length)];
  ct.style.left = (x + 20) + 'px';
  ct.style.top = (y - 30) + 'px';
  ct.style.fontSize = Math.min(60, 28 + speed * 0.3) + 'px';
  ct.classList.add('show');
  setTimeout(() => ct.classList.remove('show'), 300);

  // Sparks
  const colors = ['#ffff00','#ff8800','#ffdd44','#ffffff','#ff4400'];
  for(let i = 0; i < Math.floor(speed / 8); i++) {
    const spark = document.createElement('div');
    spark.className = 'spark';
    const size = Math.random() * 4 + 2;
    spark.style.cssText = `
      width:${size}px; height:${size}px;
      left:${x}px; top:${y}px;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      --dx:${(Math.random()-0.5)*100}px;
      --dy:${(Math.random()-0.5)*100}px;
    `;
    document.body.appendChild(spark);
    setTimeout(() => spark.remove(), 450);
  }

  // Sound-like terminal output
  const whipLogs = [
    `[CRACK] Speed multiplier: ${speedMultiplier.toFixed(2)}x`,
    `[WHIP] Velocity: ${Math.floor(speed)} px/frame | CPU: ${Math.floor(speedMultiplier * 12)}% boost`,
    `[SNAP] Terminal acceleration +${(speedMultiplier * 10).toFixed(0)}%`,
    `[THWACK] Process priority escalated by whip authority`,
    `[FWISH] Clock speed overclocked to ${(speedMultiplier * 100).toFixed(0)}MHz`,
  ];
  appendLine(whipLogs[Math.floor(Math.random() * whipLogs.length)], 'whip');

  // Speed up typing sim
  if(speedMultiplier > 3) {
    appendLine(`> WARNING: Terminal running at ${speedMultiplier.toFixed(1)}x speed`, 'error');
  }
}

// ─── TERMINAL LOGIC ──────────────────────────────────────────────────────────
const output = document.getElementById('output-area');
const input = document.getElementById('cmd-input');

function appendLine(text, cls = 'output') {
  const d = document.createElement('div');
  d.className = `line ${cls}`;
  d.textContent = text;
  output.appendChild(d);
  output.scrollTop = output.scrollHeight;
}

// Boot sequence
const bootLines = [
  { t:'system', m:'WHIP-TERMINAL v2.6 — CRAKC-ACCELERATED COMPUTING' },
  { t:'system', m:'Copyright (c) 2026 Whiplash Systems Inc.' },
  { t:'output', m:'Loading kernel modules...' },
  { t:'output', m:'[  0.000] Initializing whip subsystem' },
  { t:'output', m:'[  0.012] Rope physics engine: OK' },
  { t:'output', m:'[  0.034] Crack detection: ENABLED' },
  { t:'output', m:'[  0.067] Speed amplifier: STANDBY' },
  { t:'info',   m:'[  0.098] TIP: Move mouse fast to crack the whip and speed up terminal!' },
  { t:'output', m:'─────────────────────────────────────────' },
  { t:'prompt', m:'root@whip:~$ _' },
];

let bi = 0;
function bootNext() {
  if(bi >= bootLines.length) return;
  const l = bootLines[bi++];
  appendLine(l.m, l.t);
  setTimeout(bootNext, 60 + Math.random() * 80);
}
setTimeout(bootNext, 300);

// Commands
const commands = {
  help: () => {
    appendLine('Available commands:', 'info');
    appendLine('  help        - Show this help', 'output');
    appendLine('  ls          - List files', 'output');
    appendLine('  whoami      - Show user', 'output');
    appendLine('  speed       - Show current speed', 'output');
    appendLine('  whips       - Show whip count', 'output');
    appendLine('  crack       - Manual crack test', 'output');
    appendLine('  clear       - Clear terminal', 'output');
    appendLine('  matrix      - Enter the matrix', 'output');
    appendLine('  reset       - Reset speed', 'output');
    appendLine('  uname       - System info', 'output');
    appendLine('', 'output');
    appendLine('> TIP: Swing your mouse FAST to crack the whip!', 'info');
  },
  ls: () => {
    appendLine('drwxr-xr-x  crack_engine/', 'output');
    appendLine('drwxr-xr-x  whip_physics/', 'output');
    appendLine('-rwxr-xr-x  terminal.sh', 'output');
    appendLine('-rw-r--r--  speed.log', 'output');
    appendLine('-rw-r--r--  whip_count.dat', 'output');
    appendLine('-rwxr-xr-x  overclock.bin', 'output');
  },
  whoami: () => appendLine('root (whip authority granted)', 'output'),
  speed: () => {
    appendLine(`Current multiplier: ${speedMultiplier.toFixed(2)}x`, 'info');
    appendLine(`Terminal velocity: ${(speedMultiplier * 100).toFixed(0)}%`, 'output');
    appendLine(`Whips administered: ${whipCount}`, 'output');
  },
  whips: () => {
    appendLine(`Total cracks: ${whipCount}`, 'info');
    appendLine(`Speed gained: ${((speedMultiplier - 1) * 100).toFixed(0)}%`, 'output');
    if(whipCount === 0) appendLine('Move mouse fast to crack!', 'info');
    else if(whipCount < 5) appendLine('Keep whipping for more speed!', 'info');
    else if(whipCount < 15) appendLine('You are getting dangerous...', 'info');
    else appendLine('MAXIMUM OVERDRIVE ACHIEVED', 'error');
  },
  crack: () => {
    triggerCrack(window.innerWidth/2, window.innerHeight/2, 55);
  },
  clear: () => { output.innerHTML = ''; },
  reset: () => {
    speedMultiplier = 1.0;
    whipCount = 0;
    document.getElementById('speed-val').textContent = '1.0';
    document.getElementById('whip-count-display').textContent = '0';
    appendLine('Speed reset to 1.0x', 'info');
    appendLine('Whip count reset', 'output');
  },
  matrix: () => {
    appendLine('Entering the matrix...', 'system');
    let cols = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン'.split('');
    for(let i=0;i<8;i++){
      let row = '';
      for(let j=0;j<40;j++) row += cols[Math.floor(Math.random()*cols.length)];
      setTimeout(() => appendLine(row, 'output'), i*100);
    }
    setTimeout(() => appendLine('> Wake up, Neo...', 'error'), 900);
  },
  uname: () => {
    appendLine('WHIP-OS 2.6.1 whip-terminal x86_64 GNU/Linux', 'output');
    appendLine(`Uptime: ${Math.floor(performance.now()/1000)}s | Load: ${speedMultiplier.toFixed(1)}x`, 'output');
  },
};

input.addEventListener('keydown', (e) => {
  if(e.key === 'Enter') {
    const cmd = input.value.trim().toLowerCase();
    if(!cmd) return;

    appendLine(`root@whip:~$ ${input.value}`, 'prompt');
    input.value = '';

    const delay = Math.max(10, 300 / speedMultiplier);

    setTimeout(() => {
      if(commands[cmd]) {
        commands[cmd]();
      } else {
        appendLine(`bash: ${cmd}: command not found`, 'error');
        appendLine(`(Hint: try 'help')`, 'info');
      }
    }, delay);
  }
});

// ─── MAIN LOOP ───────────────────────────────────────────────────────────────
function loop() {
  updateRope();
  drawWhip();
  detectCrack();
  requestAnimationFrame(loop);
}
loop();

// Focus input on click
document.addEventListener('click', () => input.focus());
input.focus();
</script>
</body>
</html>
