<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Ball Physics Simulator</title>
    <style>
        body { margin: 0; background: #050505; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #canvas-container { position: relative; box-shadow: 0 0 50px rgba(0,0,0,0.5); }
        canvas { display: block; border-radius: 50%; border: 4px solid #333; }
        .ui-overlay { position: absolute; top: -40px; width: 100%; text-align: center; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; color: #00ffcc; text-shadow: 0 0 10px #00ffcc; }
        /* Style untuk GUI agar terlihat profesional */
        .lil-gui { --width: 250px; --name-width: 40%; }
    </style>
</head>
<body>

<div id="canvas-container">
    <div class="ui-overlay" id="statusText">Bounces: 0</div>
    <canvas id="simCanvas"></canvas>
</div>

<script type="module">
    import GUI from 'https://cdn.jsdelivr.net/npm/lil-gui@0.19/+esm';

    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('statusText');

    // KONFIGURASI YANG BISA DIKONTROL
    const params = {
        speed: 5,
        gravity: 0.15,
        friction: 0.999,
        growthRate: 1.2,
        trailOpacity: 0.1,
        maxTrails: 150,
        colorHue: 180,
        enableSound: true,
        reset: () => resetSim()
    };

    // Setup GUI
    const gui = new GUI();
    gui.add(params, 'speed', 1, 20).name('Kecepatan Awal');
    gui.add(params, 'gravity', 0, 1).name('Gravitasi');
    gui.add(params, 'growthRate', 0, 5).name('Pertumbuhan');
    gui.add(params, 'trailOpacity', 0.01, 0.5).name('Kepekatan Jejak');
    gui.add(params, 'colorHue', 0, 360).name('Warna (Hue)');
    gui.add(params, 'enableSound').name('Efek Suara');
    gui.add(params, 'reset').name('RESET SIMULASI');

    // Inisialisasi Ukuran
    const size = Math.min(window.innerWidth * 0.8, 600);
    canvas.width = size;
    canvas.height = size;
    const centerX = size / 2;
    const centerY = size / 2;
    const boundaryRadius = (size / 2) - 10;

    let ball, bounces;

    function resetSim() {
        bounces = 0;
        ball = {
            x: centerX,
            y: centerY,
            vx: params.speed,
            vy: 0,
            radius: 15,
            trails: []
        };
    }

    // Fungsi Suara (Audio Context)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBounceSound(freq) {
        if (!params.enableSound) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
    }

    function update() {
        // Gravitasi & Friksi
        ball.vy += params.gravity;
        ball.vx *= params.friction;
        ball.vy *= params.friction;

        ball.x += ball.vx;
        ball.y += ball.vy;

        // Cek Tabrakan Lingkaran
        const dx = ball.x - centerX;
        const dy = ball.y - centerY;
        const dist = Math.sqrt(dx*dx + dy*dy);

        if (dist + ball.radius >= boundaryRadius) {
            const nx = dx / dist;
            const ny = dy / dist;

            // Pantulan fisik
            const dot = ball.vx * nx + ball.vy * ny;
            ball.vx = (ball.vx - 2 * dot * nx) * 1.05; // Sedikit boost kecepatan tiap pantul
            ball.vy = (ball.vy - 2 * dot * ny) * 1.05;

            // Koreksi posisi
            const overlap = (dist + ball.radius) - boundaryRadius;
            ball.x -= nx * overlap;
            ball.y -= ny * overlap;

            // Evolusi
            ball.radius += params.growthRate;
            bounces++;
            statusText.innerText = `Bounces: ${bounces}`;
            
            // Play Sound (Frekuensi naik tiap pantulan)
            playBounceSound(200 + (bounces * 10));
        }

        // Simpan Jejak
        ball.trails.push({x: ball.x, y: ball.y, r: ball.radius});
        if (ball.trails.length > params.maxTrails) ball.trails.shift();
    }

    function draw() {
        // Background trail effect
        ctx.fillStyle = `rgba(5, 5, 5, ${params.trailOpacity})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Gambar Jejak
        ball.trails.forEach((t, i) => {
            ctx.beginPath();
            ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2);
            ctx.fillStyle = `hsla(${params.colorHue}, 80%, 50%, ${i / ball.trails.length * 0.2})`;
            ctx.fill();
        });

        // Gambar Lingkaran Pembatas
        ctx.beginPath();
        ctx.arc(centerX, centerY, boundaryRadius, 0, Math.PI * 2);
        ctx.strokeStyle = `hsl(${params.colorHue}, 100%, 50%)`;
        ctx.lineWidth = 2;
        ctx.stroke();

        // Gambar Bola Utama
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fillStyle = `hsl(${params.colorHue}, 100%, 60%)`;
        ctx.shadowBlur = 15;
        ctx.shadowColor = `hsl(${params.colorHue}, 100%, 50%)`;
        ctx.fill();
        ctx.shadowBlur = 0; // Reset shadow biar tidak berat
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    resetSim();
    loop();
</script>
</body>
</html>
